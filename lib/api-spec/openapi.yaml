openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: Read-only access to persisted real daily regime signals
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [signals]
      summary: Describe the signal contract and point-in-time guarantees
      responses:
        "200":
          description: Signal API capabilities
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, observation_modes, point_in_time_fields, pagination, filters]
                properties:
                  contract_version: {type: string}
                  observation_modes: {type: array, items: {type: string}}
                  live_recorded: {type: boolean}
                  point_in_time_fields: {type: array, items: {type: string}}
                  ordering: {type: array, items: {type: string}, example: [session_date, event_id]}
                  filters: {type: array, items: {type: string}}
                  pagination: {type: object, additionalProperties: true}
                  freshness_sla: {type: string}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /signals/latest:
    get:
      operationId: getLatestSignal
      tags: [signals]
      summary: Get the latest persisted real signal
      responses:
        "200":
          description: Latest signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestSignalResponse"
        "503":
          description: Verified signal data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /signals/history:
    get:
      operationId: getSignalHistory
      tags: [signals]
      summary: Get persisted real signals in an inclusive date range
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: model_version
          in: query
          required: false
          schema: {type: string}
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: cursor
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Signal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalHistoryResponse"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Verified signal data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /signals/provenance:
    get:
      operationId: getSignalProvenance
      tags: [signals]
      summary: Get provenance for the persisted real signal dataset
      responses:
        "200":
          description: Signal provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalProvenanceResponse"
        "503":
          description: Verified signal data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        signal_artifacts:
          oneOf:
            - $ref: "#/components/schemas/SignalArtifactsReady"
            - $ref: "#/components/schemas/SignalArtifactsUnavailable"
      required:
        - status
        - signal_artifacts
    SignalArtifactsReady:
      type: object
      required:
        - status
        - model_version
        - history_row_count
        - history_first_date
        - history_last_date
      properties:
        status:
          type: string
          const: ready
        model_version:
          type: string
        history_row_count:
          type: integer
        history_first_date:
          type: string
        history_last_date:
          type: string
    SignalArtifactsUnavailable:
      type: object
      required:
        - status
        - reason
      properties:
        status:
          type: string
          const: unavailable
        reason:
          type: string
          const: missing_or_invalid
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SignalObservation:
      type: object
      required:
        - event_id
        - contract_version
        - session_date
        - market_as_of
        - available_at
        - computed_at
        - source_retrieved_at
        - model_version
        - input_data_snapshot_id
        - signal_snapshot_id
        - input_checksum
        - signal_checksum
        - observation_mode
        - live_recorded
        - date
        - data_lane
        - regime
        - risk_signal
        - overall_stress_score
        - body_stress_score
        - tail_risk_hazard_score
        - confidence_score
        - confidence
        - data_quality
        - available_component_count
        - missing_inputs
        - primary_drivers
        - score_type
        - probability_status
      properties:
        event_id: {type: string}
        contract_version: {type: string}
        session_date: {type: string, format: date}
        market_as_of: {type: string, format: date-time}
        available_at: {type: string, format: date-time}
        computed_at: {type: string, format: date-time}
        source_retrieved_at: {type: string, format: date-time}
        model_version: {type: string}
        input_data_snapshot_id: {type: string}
        signal_snapshot_id: {type: string}
        input_checksum: {type: string}
        signal_checksum: {type: string}
        row_checksum: {type: string}
        observation_mode: {type: string, enum: [LIVE_REGISTERED, HISTORICAL_RECONSTRUCTION]}
        live_recorded: {type: boolean}
        date:
          type: string
          format: date
        data_lane:
          type: string
        regime:
          type: string
        risk_signal:
          type: string
          enum: [RISK-ON, NEUTRAL, DE-RISK]
        overall_stress_score:
          type: number
        body_stress_score:
          type: number
        tail_risk_hazard_score:
          type: [number, "null"]
        confidence_score:
          type: number
        confidence:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        data_quality:
          type: string
        available_component_count:
          type: integer
        missing_inputs:
          type: string
        primary_drivers:
          type: string
        score_type:
          type: string
        probability_status:
          type: string
          enum: [NOT_CALIBRATED]
    LatestSignalResponse:
      type: object
      required:
        - observation_mode
        - live_recorded
        - model_version
        - retrieved_at_utc
        - data_snapshot_id
        - data
      properties:
        observation_mode:
          type: string
          enum: [LIVE_REGISTERED, HISTORICAL_RECONSTRUCTION]
        live_recorded:
          type: boolean
          const: false
        model_version:
          type: string
        retrieved_at_utc:
          type: string
          format: date-time
        data_snapshot_id:
          type: string
        data:
          $ref: "#/components/schemas/SignalObservation"
    SignalHistoryResponse:
      type: object
      required:
        - observation_mode
        - live_recorded
        - model_version
        - start
        - end
        - count
        - data
      properties:
        observation_mode:
          type: string
          enum: [LIVE_REGISTERED, HISTORICAL_RECONSTRUCTION]
        live_recorded:
          type: boolean
          const: false
        model_version:
          type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        count:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/SignalObservation"
    SignalSeriesProvenance:
      type: object
      required:
        - field
        - ticker
        - source
        - first_valid_date
        - last_valid_date
        - observations
        - raw_payload_sha256
      properties:
        field:
          type: string
        ticker:
          type: string
        source:
          type: string
        first_valid_date:
          type: string
          format: date
        last_valid_date:
          type: string
          format: date
        observations:
          type: integer
        raw_payload_sha256:
          type: string
    SignalProvenanceResponse:
      type: object
      required:
        - observation_mode
        - live_recorded
        - source
        - model_version
        - requested_start_date
        - requested_end_date
        - retrieved_at_utc
        - history_first_date
        - history_last_date
        - history_row_count
        - history_sha256
        - input_data_snapshot_id
        - signal_snapshot_id
        - probability_status
        - score_semantics
        - series
      properties:
        observation_mode:
          type: string
          enum: [LIVE_REGISTERED, HISTORICAL_RECONSTRUCTION]
        live_recorded:
          type: boolean
          const: false
        source:
          type: string
        model_version:
          type: string
        requested_start_date:
          type: string
          format: date
        requested_end_date:
          type: string
          format: date
        retrieved_at_utc:
          type: string
          format: date-time
        history_first_date:
          type: string
          format: date
        history_last_date:
          type: string
          format: date
        history_row_count:
          type: integer
        history_sha256:
          type: string
        input_data_snapshot_id:
          type: string
        signal_snapshot_id:
          type: string
        probability_status:
          type: string
          enum: [NOT_CALIBRATED]
        score_semantics:
          type: string
        series:
          type: array
          items:
            $ref: "#/components/schemas/SignalSeriesProvenance"

