openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: regime.signal.v3 read-only contract
servers:
  - url: /api
tags:
  - name: signals
  - name: health
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [signals]
      responses:
        "200": {description: Capabilities, content: {application/json: {schema: {$ref: "#/components/schemas/Capabilities"}}}}
  /signals/catalog:
    get:
      operationId: getSignalCatalog
      tags: [signals]
      responses:
        "200": {description: Catalog, content: {application/json: {schema: {$ref: "#/components/schemas/Catalog"}}}}
        "503": {$ref: "#/components/responses/Unavailable"}
  /signals/latest:
    get:
      operationId: getLatestSignal
      tags: [signals]
      responses:
        "200": {description: Operational live signal, content: {application/json: {schema: {$ref: "#/components/schemas/Latest"}}}}
        "503": {$ref: "#/components/responses/Unavailable"}
  /signals/history:
    get:
      operationId: getSignalHistory
      tags: [signals]
      parameters:
        - {$ref: "#/components/parameters/Start"}
        - {$ref: "#/components/parameters/End"}
        - {$ref: "#/components/parameters/Model"}
        - {$ref: "#/components/parameters/AsOf"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200": {description: Historical research series, content: {application/json: {schema: {$ref: "#/components/schemas/History"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /signals/as-of:
    get:
      operationId: getSignalAsOf
      tags: [signals]
      parameters:
        - {$ref: "#/components/parameters/AsOfRequired"}
        - {$ref: "#/components/parameters/Start"}
        - {$ref: "#/components/parameters/End"}
        - {$ref: "#/components/parameters/Model"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200": {description: Point-in-time research series, content: {application/json: {schema: {$ref: "#/components/schemas/History"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /signals/provenance:
    get:
      operationId: getSignalProvenance
      tags: [signals]
      responses:
        "200": {description: Provenance, content: {application/json: {schema: {$ref: "#/components/schemas/Provenance"}}}}
        "503": {$ref: "#/components/responses/Unavailable"}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200": {description: Healthy or stale, content: {application/json: {schema: {$ref: "#/components/schemas/HealthStatus"}}}}
        "503": {description: Error health, content: {application/json: {schema: {$ref: "#/components/schemas/HealthStatus"}}}}
components:
  parameters:
    Start: {name: start, in: query, required: false, schema: {type: string, format: date}}
    End: {name: end, in: query, required: false, schema: {type: string, format: date}}
    Model: {name: model_version, in: query, required: false, schema: {type: string}}
    AsOf: {name: as_of, in: query, required: false, schema: {type: string, format: date-time}}
    AsOfRequired: {name: as_of, in: query, required: true, schema: {type: string, format: date-time}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string}}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unavailable: {description: Unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}}
    Capabilities:
      type: object
      required: [contract_version, observation_modes, live_recorded, point_in_time_fields, ordering, filters, pagination, freshness_sla]
      properties:
        contract_version: {type: string, const: regime.signal.v3}
        observation_modes: {type: array, items: {type: string, enum: [LIVE_REGISTERED, HISTORICAL_RECONSTRUCTION]}}
        live_recorded: {type: boolean}
        point_in_time_fields: {type: array, items: {type: string}}
        ordering: {type: array, items: {type: string}}
        filters: {type: array, items: {type: string}}
        pagination: {type: object, additionalProperties: true}
        freshness_sla: {type: string}
    Signal:
      type: object
      required: [event_id, contract_version, session_date, market_as_of, available_at, computed_at, source_retrieved_at, model_version, input_data_snapshot_id, signal_snapshot_id, input_checksum, signal_checksum, row_checksum, observation_mode, live_recorded, date, data_lane, regime, risk_signal, overall_stress_score, body_stress_score, tail_risk_hazard_score, confidence_score, confidence, data_quality, available_component_count, missing_inputs, primary_drivers, score_type, probability_status, revision_id, observation_at, valid_from, valid_until, ingested_at, source_mode, freshness, quality, provider_lineage, config_checksum, data_checksum, provenance, research_only]
      properties:
        event_id: {type: string}
        contract_version: {type: string, const: regime.signal.v3}
        session_date: {type: string, format: date}
        date: {type: string, format: date}
        market_as_of: {type: string, format: date-time}
        available_at: {type: string, format: date-time}
        computed_at: {type: string, format: date-time}
        source_retrieved_at: {type: string, format: date-time}
        model_version: {type: string}
        input_data_snapshot_id: {type: string}
        signal_snapshot_id: {type: string}
        input_checksum: {type: string}
        signal_checksum: {type: string}
        row_checksum: {type: string}
        observation_mode: {type: string, enum: [LIVE_REGISTERED, HISTORICAL_RECONSTRUCTION]}
        live_recorded: {type: boolean}
        data_lane: {type: string}
        regime: {type: string}
        risk_signal: {type: string, enum: [RISK-ON, NEUTRAL, DE-RISK]}
        overall_stress_score: {type: number}
        body_stress_score: {type: number}
        tail_risk_hazard_score: {type: [number, "null"]}
        confidence_score: {type: number}
        confidence: {type: string, enum: [LOW, MEDIUM, HIGH]}
        data_quality: {type: string}
        available_component_count: {type: integer}
        missing_inputs: {type: string}
        primary_drivers: {type: string}
        score_type: {type: string}
        probability_status: {type: string, const: NOT_CALIBRATED}
        revision_id: {type: string}
        observation_at: {type: string, format: date-time}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        ingested_at: {type: string, format: date-time}
        source_mode: {type: string}
        freshness: {type: string}
        quality: {type: string}
        provider_lineage: {type: object, additionalProperties: true}
        config_checksum: {type: string}
        data_checksum: {type: string}
        provenance: {type: object, additionalProperties: true}
        research_only: {type: boolean}
      additionalProperties: true
    Latest:
      type: object
      required: [contract_version, observation_mode, live_recorded, model_version, retrieved_at_utc, data_snapshot_id, data]
      properties:
        contract_version: {type: string}
        observation_mode: {type: string, const: LIVE_REGISTERED}
        live_recorded: {type: boolean, const: true}
        model_version: {type: string}
        retrieved_at_utc: {type: string, format: date-time}
        data_snapshot_id: {type: string}
        data: {$ref: "#/components/schemas/Signal"}
    History:
      type: object
      required: [contract_version, observation_mode, live_recorded, model_version, start, end, as_of, count, total, data, next_cursor]
      properties:
        contract_version: {type: string}
        observation_mode: {type: string, enum: [LIVE_REGISTERED, HISTORICAL_RECONSTRUCTION, MIXED]}
        live_recorded: {type: boolean}
        model_version: {type: ["string", "null"]}
        start: {type: ["string", "null"], format: date}
        end: {type: ["string", "null"], format: date}
        as_of: {type: ["string", "null"], format: date-time}
        count: {type: integer}
        total: {type: integer}
        data: {type: array, items: {$ref: "#/components/schemas/Signal"}}
        next_cursor: {type: ["string", "null"]}
    Catalog:
      type: object
      required: [contract_version, source, models, bounds]
      properties:
        contract_version: {type: string}
        source: {type: string}
        models: {type: array, items: {type: object, additionalProperties: true}}
        bounds: {type: object, additionalProperties: true}
    Provenance:
      type: object
      required: [contract_version, observation_mode, live_recorded, source, model_version, requested_start_date, requested_end_date, retrieved_at_utc, history_first_date, history_last_date, history_row_count, history_sha256, input_data_snapshot_id, signal_snapshot_id, probability_status, score_semantics, series]
      properties:
        contract_version: {type: string}
        observation_mode: {type: string}
        live_recorded: {type: boolean}
        source: {type: string}
        model_version: {type: ["string", "null"]}
        requested_start_date: {type: ["string", "null"], format: date}
        requested_end_date: {type: ["string", "null"], format: date}
        retrieved_at_utc: {type: ["string", "null"], format: date-time}
        history_first_date: {type: ["string", "null"], format: date}
        history_last_date: {type: ["string", "null"], format: date}
        history_row_count: {type: integer}
        history_sha256: {type: ["string", "null"]}
        input_data_snapshot_id: {type: ["string", "null"]}
        signal_snapshot_id: {type: ["string", "null"]}
        probability_status: {type: string, const: NOT_CALIBRATED}
        score_semantics: {type: ["string", "null"]}
        series: {type: array, items: {type: object, additionalProperties: true}}
    HealthStatus:
      type: object
      required: [status, freshness_sla_hours, integrity, connectivity, source_freshness, computation, persistence, hub_eligibility]
      properties:
        status: {type: string, enum: [HEALTHY, STALE, ERROR]}
        freshness_sla_hours: {type: number}
        integrity: {type: object, additionalProperties: true}
        connectivity: {type: object, additionalProperties: true}
        source_freshness: {type: object, additionalProperties: true}
        computation: {type: object, additionalProperties: true}
        persistence: {type: object, additionalProperties: true}
        hub_eligibility: {type: object, additionalProperties: true}